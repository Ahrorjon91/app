services:
  devops-academy:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-academy-portal:latest
    container_name: devops-academy-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_API_BASE_PATH=/api
      - SQLITE_DB_PATH=/app/data/devops_portal.sqlite
    volumes:
      - portal_data:/app/data
      - portal_uploads:/app/uploads

volumes:
  portal_data:
  portal_uploads:
